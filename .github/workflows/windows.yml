name: windows

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/capture/rust
            modules/speech/rust
      - uses: LABSN/sound-ci-helpers@v1
      - name: Install the MyGo CLI
        run: go install github.com/egoist/mygo/cmd/mygo@v0.10.0

      - name: Audio devices
        shell: pwsh
        run: |
          Get-Service Audiosrv | Format-List Status, StartType
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
          [System.Environment]::OSVersion.Version

      - name: Let desktop apps use the microphone
        shell: pwsh
        run: |
          foreach ($hive in 'HKLM', 'HKCU') {
            reg add "$hive\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone" /v Value /t REG_SZ /d Allow /f
          }

      - name: Play a tone from another process
        shell: pwsh
        run: |
          $wav = (Resolve-Path modules/capture/testdata/tone.wav).Path
          $player = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "while (1) { (New-Object System.Media.SoundPlayer '$wav').PlaySync() }"
          "MEETKEEP_TONE_PID=$($player.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 2

      - name: Capture, in Rust
        run: cargo test --manifest-path modules/capture/rust/Cargo.toml -- --test-threads=1 --nocapture

      - name: Capture, from Go through MyGo
        run: |
          mygo native build -target host modules/capture
          go test -v -count=1 ./modules/capture

      - name: Settings, storage and the recorder
        run: go test -count=1 ./internal/... ./cmd/...

      - name: Speech fixtures
        shell: bash
        run: |
          mkdir fixtures && cd fixtures
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSLO $base/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          tar xjf sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          mv sherpa-onnx-pyannote-segmentation-3-0/model.onnx segmentation.onnx
          curl -sSL -o embedding.onnx $base/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
          curl -sSLO $base/speaker-segmentation-models/0-four-speakers-zh.wav
          ls -l

      - name: Speech, from Go through MyGo
        shell: bash
        run: |
          mygo native build -target host modules/speech
          MEETKEEP_SPEECH_FIXTURES="$PWD/fixtures" go test -v -count=1 ./modules/speech

      - name: The app itself
        run: go test -count=1 .

  # The app run as a user runs it, on the runner's desktop: its windows, a
  # recording from the virtual sound card, the command line. Pictures of
  # every step are kept with the run.
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/capture/rust
            modules/speech/rust
      - uses: LABSN/sound-ci-helpers@v1

      - name: Let desktop apps use the microphone
        shell: pwsh
        run: |
          foreach ($hive in 'HKLM', 'HKCU') {
            reg add "$hive\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone" /v Value /t REG_SZ /d Allow /f
          }
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Play a tone from another process
        shell: pwsh
        run: |
          $wav = (Resolve-Path modules/capture/testdata/tone.wav).Path
          Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "while (1) { (New-Object System.Media.SoundPlayer '$wav').PlaySync() }"

      - name: Build the app with the automation plugin
        env:
          GOFLAGS: -tags=e2e
        run: |
          bun install --frozen-lockfile
          bun run build -- -debug -skip-installer
          Get-ChildItem -Recurse build/windows-amd64 | Select-Object FullName, Length

      - name: Run it
        run: go run -tags e2e ./cmd/smoke build/windows-amd64/MeetKeep.exe smoke modules/capture/testdata/tone.wav

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: |
            smoke/*.png
            smoke/app.log
